name: Build Zinox Vocals

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ver = "0.0.0-dev"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}" -replace '^v','' }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          $artefacts = "build/ZinoxVocals_artefacts/Release"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Compress-Archive -Path "$artefacts/VST3/Zinox Vocals.vst3" -DestinationPath "stage/ZinoxVocals-Windows-VST3.zip"
          Compress-Archive -Path "$artefacts/Standalone/Zinox Vocals.exe" -DestinationPath "stage/ZinoxVocals-Windows-Standalone.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          $ver = "${{ steps.version.outputs.version }}"
          & "$iscc" "/DMyAppVersion=$ver" Installer\ZinoxVocals.iss
          Copy-Item "Installer\Output\ZinoxVocals-Setup-$ver.exe" "stage\"

      - uses: actions/upload-artifact@v4
        with:
          name: ZinoxVocals-Windows
          path: stage/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="0.0.0-dev"
          if [ "${{ github.ref_type }}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate Audio Unit (informational)
        continue-on-error: true
        run: auval -v aufx Zvcl Znxa

      - name: Stage artifacts
        run: |
          artefacts="build/ZinoxVocals_artefacts/Release"
          mkdir -p stage
          ditto -c -k --sequesterRsrc --keepParent "$artefacts/VST3/Zinox Vocals.vst3" stage/ZinoxVocals-macOS-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent "$artefacts/AU/Zinox Vocals.component" stage/ZinoxVocals-macOS-AU.zip
          ditto -c -k --sequesterRsrc --keepParent "$artefacts/Standalone/Zinox Vocals.app" stage/ZinoxVocals-macOS-Standalone.zip

      - name: Build installer (pkgbuild)
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          artefacts="build/ZinoxVocals_artefacts/Release"
          root="pkgroot"
          rm -rf "$root"

          mkdir -p "$root/vst3root/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$root/auroot/Library/Audio/Plug-Ins/Components"
          mkdir -p "$root/approot/Applications"
          cp -R "$artefacts/VST3/Zinox Vocals.vst3" "$root/vst3root/Library/Audio/Plug-Ins/VST3/"
          cp -R "$artefacts/AU/Zinox Vocals.component" "$root/auroot/Library/Audio/Plug-Ins/Components/"
          cp -R "$artefacts/Standalone/Zinox Vocals.app" "$root/approot/Applications/"

          mkdir -p "$root/pkgs"
          pkgbuild --root "$root/vst3root" --identifier com.zinoxaudio.zinoxvocals.vst3 \
                   --version "$VERSION" --install-location "/" "$root/pkgs/vst3.pkg"
          pkgbuild --root "$root/auroot" --identifier com.zinoxaudio.zinoxvocals.au \
                   --version "$VERSION" --install-location "/" "$root/pkgs/au.pkg"
          pkgbuild --root "$root/approot" --identifier com.zinoxaudio.zinoxvocals.app \
                   --version "$VERSION" --install-location "/" "$root/pkgs/app.pkg"

          echo "Zinox Vocals installs the VST3 plugin, the Audio Unit component, and the standalone app." > "$root/welcome.txt"

          cat > "$root/distribution.xml" << XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
              <title>Zinox Vocals</title>
              <organization>com.zinoxaudio</organization>
              <options customize="allow" require-scripts="false" rootVolumeOnly="true"/>
              <welcome file="welcome.txt"/>
              <choices-outline>
                  <line choice="vst3"/>
                  <line choice="au"/>
                  <line choice="app"/>
              </choices-outline>
              <choice id="vst3" title="VST3 Plugin" description="Installs the VST3 plugin for VST3 hosts.">
                  <pkg-ref id="com.zinoxaudio.zinoxvocals.vst3"/>
              </choice>
              <choice id="au" title="Audio Unit" description="Installs the AU component for Logic Pro, GarageBand and other AU hosts.">
                  <pkg-ref id="com.zinoxaudio.zinoxvocals.au"/>
              </choice>
              <choice id="app" title="Standalone App" description="Installs the standalone Zinox Vocals application.">
                  <pkg-ref id="com.zinoxaudio.zinoxvocals.app"/>
              </choice>
              <pkg-ref id="com.zinoxaudio.zinoxvocals.vst3" version="$VERSION" onConclusion="none">vst3.pkg</pkg-ref>
              <pkg-ref id="com.zinoxaudio.zinoxvocals.au" version="$VERSION" onConclusion="none">au.pkg</pkg-ref>
              <pkg-ref id="com.zinoxaudio.zinoxvocals.app" version="$VERSION" onConclusion="none">app.pkg</pkg-ref>
          </installer-gui-script>
          XML

          productbuild --distribution "$root/distribution.xml" --package-path "$root/pkgs" \
                       --resources "$root" "stage/ZinoxVocals-Setup-$VERSION.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ZinoxVocals-macOS
          path: stage/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

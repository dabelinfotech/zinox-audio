name: Build Zinox Vocals

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          $artefacts = "build/ZinoxVocals_artefacts/Release"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Compress-Archive -Path "$artefacts/VST3/Zinox Vocals.vst3" -DestinationPath "stage/ZinoxVocals-Windows-VST3.zip"
          Compress-Archive -Path "$artefacts/Standalone/Zinox Vocals.exe" -DestinationPath "stage/ZinoxVocals-Windows-Standalone.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & "$iscc" Installer\ZinoxVocals.iss
          Copy-Item "Installer\Output\ZinoxVocals-Setup-1.0.0.exe" "stage\"

      - uses: actions/upload-artifact@v4
        with:
          name: ZinoxVocals-Windows
          path: stage/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate Audio Unit (informational)
        continue-on-error: true
        run: auval -v aufx Zvcl Znxa

      - name: Stage artifacts
        run: |
          artefacts="build/ZinoxVocals_artefacts/Release"
          mkdir -p stage
          ditto -c -k --sequesterRsrc --keepParent "$artefacts/VST3/Zinox Vocals.vst3" stage/ZinoxVocals-macOS-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent "$artefacts/AU/Zinox Vocals.component" stage/ZinoxVocals-macOS-AU.zip
          ditto -c -k --sequesterRsrc --keepParent "$artefacts/Standalone/Zinox Vocals.app" stage/ZinoxVocals-macOS-Standalone.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ZinoxVocals-macOS
          path: stage/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
